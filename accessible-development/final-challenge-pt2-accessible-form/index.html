<html>
    <head>
        <script src="https://code.iconify.design/2/2.2.1/iconify.min.js"></script>
        
        <!-- Fonts & Icons -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
        
        <link rel="stylesheet" href="index.css">
    </head>
    <body class="contact-page">
        <main id="main">
            <!-- Form section -->
            <section class="contact-form-section">
                <form>
                    <h2 class="contact-form-heading">Reach <span>Out</span></h2>
                    <div class="contact-form-intro">Curious about something? Complete these fields and "get in touch", as you humans say. 🤙</div>
                    <label for="fullname">Full name</label>
                    <input class="contact-input" id="fullname" type="text" placeholder="e.g. Jane Doe" />
                    <label for="email">Email</label>
                    <input class="contact-input" id="email" type="text" placeholder="e.g. name@example.com" />
                    <label for="message">Your message</label>
                    <textarea class="contact-textarea" id="message" rows="4" cols="50" placeholder="Write your message here..."></textarea>
                    <button class="contact-submit-button" type="button" onclick="submitForm()">Send message 🎉</button>
                </form>
                <img class="contact-image" src="images/connect.jpg" alt="A human and robotic hand reaching out to each other." />
            </section>
        </main>
    </body>
</html>
